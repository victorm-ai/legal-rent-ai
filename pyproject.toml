[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "contract-analyzer-mexico"
version = "0.1.0"
description = "Legal Rent AI - Lease contract analysis MVP for Mexico"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Web Framework
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "python-multipart>=0.0.6",
    
    # Document Processing
    "PyPDF2>=3.0.0",
    "python-docx>=0.8.11",
    "pdfplumber>=0.9.0",
    "pytesseract>=0.3.10",
    "Pillow>=10.0.0",
    
    # LLM / AI
    "openai>=1.0.0",
    "litellm>=1.55.0",
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.2.0",
    "azure-identity>=1.15.0",
    "anthropic>=0.7.0",
    
    # Data Validation
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",

    # Database
    "pyodbc>=5.0.0",
    
    # Authentication
    "PyJWT>=2.8.0",
    "azure-communication-email>=1.0.0",
    
    # Utilities
    "python-dotenv>=1.0.0",
    "structlog>=24.1.0",
]

[project.optional-dependencies]
rag = [
    "chromadb>=0.4.0",
    "sentence-transformers>=2.2.0",
]
azure-email = [
    "azure-communication-email>=1.0.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.7.0",
    "ruff>=0.0.292",
    "mypy>=1.5.0",
]

[tool.setuptools.packages.find]
where = ["backend"]
include = [
    "ai*",
    "analysis*",
    "api*",
    "app_logging*",
    "auth*",
    "config*",
    "data*",
    "document*",
    "domain*",
    "guardrails*",
    "llm*",
    "notification*",
    "observability*",
    "rag*",
    "report*",
    "services*",
    "agents*",
    "scheduling*",
]

[tool.pytest.ini_options]
pythonpath = [".", "backend"]
testpaths = ["tests"]
markers = [
    "llm_eval: live LLM evaluation (calls analysis provider API)",
    "llm_judge: LLM-as-judge evaluation (calls EVAL_JUDGE model)",
]
